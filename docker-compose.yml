# Production deployment: one service, SQLite on ./data, migrations before start.
#   docker compose up --build
# Then open http://localhost:3100.
#
# The Herdr socket is mounted read-only from the host config directory so the
# agents screens work inside the container. Override HERDR_CONFIG_DIR if Herdr
# keeps its socket somewhere else.
#
# The harness state directories are mounted read-only too: Herdr's status line is
# only a label, so the model a pane is really running is read from the harness's
# own session state (see AGENTS.md → "Which model is the agent running?"). Pi's
# agent dir also holds auth.json, so only its sessions subtree is mounted.
#
# The Servers screen needs the host's procfs: `pid: host` makes /proc the host's
# (PID 1's network namespace holds the host listening sockets), and the two
# capabilities let the collector name the process owning a socket. Without them
# the screen still lists ports, with the process column empty. See AGENTS.md →
# "Host listeners".

name: nexus

services:
  nexus:
    image: nexus:latest
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    pid: host
    # SYS_PTRACE: the ptrace check on /proc/<pid>/fd/<n>; DAC_OVERRIDE: listing
    # another user's fd directory. apparmor=unconfined: the default profile
    # forbids cross-profile ptrace. The entrypoint re-grants the first two as
    # ambient capabilities to the unprivileged app user (see docker-entrypoint.sh).
    cap_add:
      - SYS_PTRACE
      - DAC_OVERRIDE
    security_opt:
      - apparmor=unconfined
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3210}:3100"
    volumes:
      - ./data:/app/data
      - ${HERDR_CONFIG_DIR:-${HOME}/.config/herdr}:/herdr:ro
      - ${PI_SESSIONS_DIR:-${HOME}/.pi/agent/sessions}:/harness/pi/sessions:ro
      - ${CLAUDE_CONFIG_DIR:-${HOME}/.claude}:/harness/claude:ro
      - ${CURSOR_CONFIG_DIR:-${HOME}/.cursor}:/harness/cursor:ro
    environment:
      - NODE_ENV=production
      - DATA_DIR=./data
      - PUID=${DOCKER_UID:-1000}
      - PGID=${DOCKER_GID:-1000}
      - HERDR_SOCKET=/herdr/herdr.sock
      # The read-only harness state root (pi/claude/cursor session stores).
      - HARNESS_STATE_DIR=/harness
      # The published port, so the Servers screen can mark its own row.
      - HOST_PORT=${HOST_PORT:-3210}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/board').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
